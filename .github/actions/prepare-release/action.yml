name: Prepare release
description: Bumps the version, commits, tags it and creates the GitHub release

# Kept for the callers that predate prepare-release-maven and prepare-release-node:
# it only deduces the ecosystem and hands over to one of them. New callers use
# the action of their ecosystem directly — see README.md.
#
# The ecosystem is deduced from the manifest that is there — pom.xml or
# package.json — unless the `ecosystem` input names it.
#
# The two actions are called by their full name: inside a composite action a
# relative `uses:` resolves against the caller's workspace, not this repository.

inputs:
  kind:
    description: "prerelease or release"
    required: true
  version:
    description: "Explicit version. Empty = next rc (prerelease; <branch>-rc1 when the current one has no -rcN), or -rc suffix dropped (release)"
    required: false
    default: ''
  dry_run:
    description: "Compute the version and stop there, pushing nothing. 'true' to enable"
    required: false
    default: 'false'
  ecosystem:
    description: "maven or node. Empty = deduced from the manifest sitting in the working directory"
    required: false
    default: ''
  module:
    description: "maven only: module carrying the application version (-pl). Empty = root pom"
    required: false
    default: ''
  working-directory:
    description: "Directory holding the manifest, when it is not the repository root"
    required: false
    default: '.'
  release-branch:
    description: "Branch carrying final releases; a prerelease is refused on it"
    required: false
    default: main
  java-version:
    description: "maven only: JDK running the maven commands"
    required: false
    default: '25'
  java-distribution:
    description: "maven only: JDK distribution"
    required: false
    default: corretto
  versions-plugin:
    description: "maven only: plugin coordinates used to set the version"
    required: false
    default: org.codehaus.mojo:versions-maven-plugin:2.19.1
  release-token:
    description: >-
      PAT used to create the release. Without it the release is created with
      github-token, and GitHub then refuses to start the workflows that listen to
      the `release` event.
    required: false
    default: ''
  github-token:
    description: "Token used to create the release when no PAT is given"
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: "Version that was bumped, tagged and released"
    value: ${{ steps.maven.outputs.version || steps.node.outputs.version }}

runs:
  using: composite
  steps:
    - name: Detect the ecosystem
      id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OVERRIDE: ${{ inputs.ecosystem }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ -n "$OVERRIDE" ]; then
          ecosystem="$OVERRIDE"
          case "$ecosystem" in
            maven | node) ;;
            *) echo "::error::ecosystem must be maven or node, got '$ecosystem'"; exit 1 ;;
          esac
        elif [ -f pom.xml ] && [ -f package.json ]; then
          # Refused rather than guessed: releasing the version of the wrong
          # manifest is worse than one line of configuration.
          echo "::error::both pom.xml and package.json sit in $WORKING_DIRECTORY: set the ecosystem input to maven or node"
          exit 1
        elif [ -f pom.xml ]; then
          ecosystem=maven
        elif [ -f package.json ]; then
          ecosystem=node
        else
          echo "::error::neither pom.xml nor package.json in $WORKING_DIRECTORY: nothing to release there"
          exit 1
        fi
        echo "ecosystem: $ecosystem"
        echo "ecosystem=$ecosystem" >> "$GITHUB_OUTPUT"

    - uses: InseeFr/rmes-githubactions-commons/.github/actions/prepare-release-maven@main
      id: maven
      if: ${{ steps.detect.outputs.ecosystem == 'maven' }}
      with:
        kind: ${{ inputs.kind }}
        version: ${{ inputs.version }}
        dry_run: ${{ inputs.dry_run }}
        module: ${{ inputs.module }}
        working-directory: ${{ inputs.working-directory }}
        release-branch: ${{ inputs.release-branch }}
        java-version: ${{ inputs.java-version }}
        java-distribution: ${{ inputs.java-distribution }}
        versions-plugin: ${{ inputs.versions-plugin }}
        release-token: ${{ inputs.release-token }}
        github-token: ${{ inputs.github-token }}

    - uses: InseeFr/rmes-githubactions-commons/.github/actions/prepare-release-node@main
      id: node
      if: ${{ steps.detect.outputs.ecosystem == 'node' }}
      with:
        kind: ${{ inputs.kind }}
        version: ${{ inputs.version }}
        dry_run: ${{ inputs.dry_run }}
        working-directory: ${{ inputs.working-directory }}
        release-branch: ${{ inputs.release-branch }}
        release-token: ${{ inputs.release-token }}
        github-token: ${{ inputs.github-token }}
