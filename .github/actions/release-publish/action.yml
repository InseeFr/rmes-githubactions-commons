name: Release - publish
description: Commits the version bump, tags it, pushes both and creates the GitHub release

# Ecosystem-agnostic second half of prepare-release-maven and prepare-release-node:
# the caller has already written the next version into its manifest, this action
# turns the working tree into a commit, a tag and a release. Called by those two
# actions, not directly.
#
# The tag is placed ON the bump commit. That is what guarantees that whatever is
# built afterwards from that tag (a Docker image, an artifact) carries the
# version the manifest declares, since the build reads it from the tree of the
# tag.

inputs:
  kind:
    description: "prerelease or release"
    required: true
  version:
    description: "Version that was written into the manifest"
    required: true
  manifest:
    description: "Manifest the version was written into, for the error messages"
    required: true
  working-directory:
    description: "Directory the bump was made in"
    required: false
    default: '.'
  release-token:
    description: >-
      PAT used to create the release. Without it the release is created with
      github-token, and GitHub then refuses to start the workflows that listen to
      the `release` event.
    required: false
    default: ''
  github-token:
    description: "Token used to create the release when no PAT is given"
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Commit and tag
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MANIFEST: ${{ inputs.manifest }}
        NEXT: ${{ inputs.version }}
        BRANCH: ${{ github.ref_name }}
        ACTOR: ${{ github.actor }}
        ACTOR_ID: ${{ github.actor_id }}
      run: |
        set -euo pipefail
        if git diff --quiet; then
          echo "::error::the bump changed nothing in $MANIFEST"
          exit 1
        fi
        # Commit attributed to whoever ran the workflow: the numeric id in the
        # noreply address is what links it back to their GitHub account.
        git config user.name "$ACTOR"
        git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
        git commit -am "chore: $NEXT"
        git tag "$NEXT"
        # Tag pushed explicitly: `--follow-tags` skips lightweight tags.
        git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/$NEXT"

    - name: Create the GitHub release
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.release-token || inputs.github-token }}
        HAS_PAT: ${{ inputs.release-token != '' }}
        NEXT: ${{ inputs.version }}
        BRANCH: ${{ github.ref_name }}
        KIND: ${{ inputs.kind }}
      run: |
        set -euo pipefail
        flags=(--target "$BRANCH" --title "$NEXT" --generate-notes)
        if [ "$KIND" = "prerelease" ]; then
          flags+=(--prerelease)
        fi
        gh release create "$NEXT" "${flags[@]}"

        if [ "$HAS_PAT" != "true" ]; then
          echo "::warning::release created with the default token: the workflows listening to the release event will NOT be triggered (GitHub never starts a workflow from an event produced by GITHUB_TOKEN). Pass a RELEASE_TOKEN secret as the release-token input."
        fi
