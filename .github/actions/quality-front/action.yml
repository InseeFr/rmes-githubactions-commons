name: Quality front
description: Installs a pnpm front-end application, runs its checks and builds it

# The checks every RMéS front-end runs, shared by all of them — see README.md.
#
# A composite action, and not a reusable workflow like the other two bricks of this
# repository, because it is called both as the body of a "Quality" job and as the
# quality gate of a job that then chains into `docker-publish.yml`. A workflow
# `uses:` cannot be inserted into an existing job, a composite action can.
#
# Every check is a command rather than a boolean: a project without `knip` passes an
# empty string and the step disappears, a project whose tests are named otherwise
# gives its own. The defaults are what the existing front-ends already run.
#
# The Sonar scan and the React diagnostics are opt-in, and skipped by default: they
# belong to a "Quality" job, not to the publication gates that chain this action
# before pushing an image. A composite action receives no secret on its own, so the
# caller hands the Sonar token over as an input; an empty one drops the scan.

inputs:
  node-version:
    description: "Node version running the checks"
    required: false
    default: "24"
  pnpm-version:
    description: "pnpm version. Empty = the one declared by packageManager in the manifest"
    required: false
    default: ""
  working-directory:
    description: "Directory holding the application, when it is not the repository root"
    required: false
    default: "."
  install-command:
    description: "Dependency installation"
    required: false
    default: pnpm install
  lint-command:
    description: "Linter. Empty = skipped"
    required: false
    default: pnpm lint
  typecheck-command:
    description: "Type checker. Empty = skipped"
    required: false
    default: pnpm typecheck
  knip-command:
    description: "Dead-code check. Empty = skipped"
    required: false
    default: pnpm knip
  jscpd-command:
    description: "Copy-paste detection. The threshold below is appended to it. Empty = skipped"
    required: false
    default: pnpm dlx jscpd@5 .
  jscpd-threshold:
    description: "Percentage of duplicated lines tolerated. Above it, the step fails"
    required: false
    default: '2'
  test-command:
    description: "Unit tests, coverage included when the project reports it. Empty = skipped"
    required: false
    default: pnpm test:coverage
  build-command:
    description: "Production build. Empty = skipped"
    required: false
    default: pnpm build
  react-doctor-command:
    description: "React diagnostics and dependency audit. Empty = skipped"
    required: false
    default: ""
  sonar-token:
    description: "SonarQube Cloud token, read from the caller's secrets. Empty = no scan"
    required: false
    default: ""
  pr-title-check:
    description: "Check that the pull request title follows Conventional Commits. 'false' to skip"
    required: false
    default: 'true'
  pr-title-require-scope:
    description: "Require a scope in the pull request title"
    required: false
    default: 'false'
  github-token:
    description: "Token reading the pull request"
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # The checks shared with the back-ends. By its full name, not
    # ./.github/actions/quality: inside a composite action a relative `uses:`
    # resolves against the caller's workspace, not this repository.
    - uses: InseeFr/rmes-githubactions-commons/.github/actions/quality@main
      with:
        pr-title-check: ${{ inputs.pr-title-check }}
        pr-title-require-scope: ${{ inputs.pr-title-require-scope }}
        github-token: ${{ inputs.github-token }}

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        package_json_file: ${{ inputs.working-directory }}/package.json

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: 🏗️ Installing Dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.install-command }}

    - name: 🧪 Running the linter
      if: ${{ inputs.lint-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.lint-command }}

    - name: 🧪 Running TypeScript
      if: ${{ inputs.typecheck-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.typecheck-command }}

    - name: 🧪 Running Knip
      if: ${{ inputs.knip-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.knip-command }}

    # `pnpm dlx` rather than a project script: the threshold is the same for every
    # front-end, and a project without the dependency is covered too. A project
    # carrying a `.jscpd.json` keeps it — it is read from the working directory,
    # and only the threshold is imposed here.
    - name: 🧪 Running jscpd
      if: ${{ inputs.jscpd-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.jscpd-command }} --threshold ${{ inputs.jscpd-threshold }}

    - name: 🧪 Running unit tests
      if: ${{ inputs.test-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.test-command }}

    - name: 🧪 Building the application
      if: ${{ inputs.build-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}

    - name: 🩺 Running React Doctor
      if: ${{ inputs.react-doctor-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.react-doctor-command }}

    # Last, so that it reports the coverage the test step has just written.
    - name: 📊 SonarCloud Scan
      # Dependabot's pull requests reach no repository secret: the token arrives
      # empty and the scan would fail on it.
      if: ${{ inputs.sonar-token != '' && github.actor != 'dependabot[bot]' }}
      # sonarcloud-github-action is deprecated in favour of this one, which targets
      # SonarQube Cloud through `sonar.host.url` (sonar-project.properties).
      uses: SonarSource/sonarqube-scan-action@v8
      with:
        projectBaseDir: ${{ inputs.working-directory }}
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
