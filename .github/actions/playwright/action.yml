name: Playwright
description: Installs a pnpm front-end application and runs its Playwright suite

# The Playwright suite of a RMéS front-end, shared by all of them — see README.md.
#
# The action knows nothing of the services the tests talk to. A front-end whose
# suite needs a back-end (Bauhaus, against a Back-Office and a GraphDB) starts it
# in its own workflow, in the steps before this action: the stack, its fixtures
# and its startup order belong to that project, not to every front-end.
#
# Playwright starts the dev server itself (webServer): the application is
# installed at the root of the repository, the Playwright project may live in a
# directory of its own, with its own manifest.

inputs:
  node-version:
    description: "Node version running the dev server and Playwright"
    required: false
    default: "24"
  pnpm-version:
    description: "pnpm version. Empty = the one declared by packageManager in the manifest"
    required: false
    default: ""
  install-command:
    description: "Installs the application the dev server runs, from the workspace root. Empty = skipped, pnpm included"
    required: false
    default: pnpm install --frozen-lockfile
  working-directory:
    description: "Directory holding the Playwright project, relative to the workspace"
    required: false
    default: "."
  e2e-install-command:
    description: "Installs the Playwright project, from working-directory, when it has its own manifest. Empty = skipped"
    required: false
    default: ""
  browsers:
    description: "Browsers installed for Playwright, space separated. Empty = every browser Playwright installs by default"
    required: false
    default: ""
  test-command:
    description: "Runs the suite, from working-directory"
    required: false
    default: npx playwright test
  report-name:
    description: "Name of the uploaded HTML report artifact. Empty = not uploaded"
    required: false
    default: playwright-report
  report-retention-days:
    description: "Retention of the report artifact"
    required: false
    default: "30"

runs:
  using: composite
  steps:
    - name: Install pnpm
      if: ${{ inputs.install-command != '' }}
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.install-command != '' && 'pnpm' || '' }}

    - name: 🏗️ Installing the application dependencies
      if: ${{ inputs.install-command != '' }}
      shell: bash
      run: ${{ inputs.install-command }}

    - name: 🏗️ Installing the Playwright project dependencies
      if: ${{ inputs.e2e-install-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.e2e-install-command }}

    - name: 🏗️ Installing the Playwright browsers
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        # Word splitting wanted: one argument per browser, none for the default set.
        # shellcheck disable=SC2086
        npx playwright install --with-deps $BROWSERS

    - name: 🧪 Running the Playwright tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CI: "true"
      run: ${{ inputs.test-command }}

    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && inputs.report-name != '' }}
      with:
        name: ${{ inputs.report-name }}
        path: ${{ inputs.working-directory }}/playwright-report/
        retention-days: ${{ inputs.report-retention-days }}
