name: Quality back
description: Runs the shared checks, then builds and tests a Maven back-end application

# The checks every RMéS back-end runs, shared by all of them — see README.md.
#
# Mirror of `quality-front`: the checks shared by every project (`quality`) first,
# then those of the stack. Called by Bauhaus-Back-Office, whose quality.yml runs
# its Sonar analysis through the Maven plugin, inside the build itself.
#
# The Sonar analysis is left to the caller: back-ends run it through the Maven
# plugin, inside the build itself, so a caller that wants it gives its own
# `verify-command` — where `quality-front`, whose front-ends scan in a separate
# step, takes a `sonar-token` and runs that step itself.

inputs:
  pr-title-check:
    description: "Check that the pull request title follows Conventional Commits. 'false' to skip"
    required: false
    default: 'true'
  pr-title-require-scope:
    description: "Require a scope in the pull request title"
    required: false
    default: 'false'
  github-token:
    description: "Token reading the pull request"
    required: false
    default: ${{ github.token }}
  java-version:
    description: "JDK building the application"
    required: false
    default: '25'
  java-distribution:
    description: "JDK distribution"
    required: false
    default: corretto
  working-directory:
    description: "Directory holding the root pom, when it is not the repository root"
    required: false
    default: '.'
  jscpd-command:
    description: "Copy-paste detection. The threshold below is appended to it. Empty = skipped"
    required: false
    default: npx --yes jscpd@5 .
  jscpd-threshold:
    description: "Percentage of duplicated lines tolerated. Above it, the step fails"
    required: false
    default: '2'
  verify-command:
    description: "Build and tests. Empty = skipped"
    required: false
    default: ./mvnw -B verify

runs:
  using: composite
  steps:
    # By its full name, not ./.github/actions/quality: inside a composite action a
    # relative `uses:` resolves against the caller's workspace, not this repository.
    - uses: InseeFr/rmes-githubactions-commons/.github/actions/quality@main
      with:
        pr-title-check: ${{ inputs.pr-title-check }}
        pr-title-require-scope: ${{ inputs.pr-title-require-scope }}
        github-token: ${{ inputs.github-token }}

    # Before the JDK and the build: a minute of static analysis rather than the
    # whole `verify` when the duplication is what fails. jscpd is a Node tool, run
    # with the Node the runner already ships — no `setup-node` for a Maven build.
    - name: 🧪 Running jscpd
      if: ${{ inputs.jscpd-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.jscpd-command }} --threshold ${{ inputs.jscpd-threshold }}

    - uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        cache: maven
        cache-dependency-path: ${{ inputs.working-directory }}/**/pom.xml

    - name: 🧪 Building and testing the application
      if: ${{ inputs.verify-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.verify-command }}
