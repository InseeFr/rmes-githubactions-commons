name: Publish Docker image
description: Builds the image of the release that fired the event and pushes it under the release tag

# Builds the image of the release that just fired the event, and pushes it under
# the release tag. Shared by every RMéS project — see README.md.
#
# The two registries in use are covered by the same call: ghcr.io for the
# prereleases (authenticated with the job's own token, hence the `packages: write`
# permission the caller must grant) and Docker Hub for the final releases
# (authenticated with dockerhub-username / dockerhub-token).
#
# The image is built from the source the caller checked out. Nothing is consumed
# from a previous job: the Dockerfiles build the application themselves. A caller
# that wants a quality gate before publishing puts it in the same job, before this
# action — which is the reason this is an action and not a reusable workflow.

inputs:
  image:
    description: "Image name without registry or tag, e.g. inseefr/bauhaus"
    required: true
  registry:
    description: "Registry to push to. Empty = Docker Hub"
    required: false
    default: ''
  dockerfile:
    description: "Dockerfile to build"
    required: false
    default: Dockerfile
  context:
    description: "Build context"
    required: false
    default: '.'
  tag:
    description: "Image tag. Empty = the tag of the release that fired the event"
    required: false
    default: ''
  latest:
    description: "Also push the image as :latest. 'true' to enable"
    required: false
    default: 'false'
  platforms:
    description: "Platforms to build for, e.g. linux/amd64,linux/arm64. Empty = the runner's own. QEMU is only set up when this is set"
    required: false
    default: ''
  dockerhub-username:
    description: "Docker Hub account, when the registry is Docker Hub"
    required: false
    default: ''
  dockerhub-token:
    description: "Docker Hub token, when the registry is Docker Hub"
    required: false
    default: ''
  github-token:
    description: "Token used to log in to ghcr.io"
    required: false
    default: ${{ github.token }}

outputs:
  image:
    description: "Fully qualified image reference that was pushed"
    value: ${{ steps.tags.outputs.image }}

runs:
  using: composite
  steps:
    - name: Check the release and compute the tags
      id: tags
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        REGISTRY: ${{ inputs.registry }}
        TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        LATEST: ${{ inputs.latest }}
        EVENT: ${{ github.event_name }}
        PRERELEASE: ${{ github.event.release.prerelease }}
      run: |
        set -euo pipefail
        if [ -z "$TAG" ]; then
          echo "::error::no tag to publish: this action expects a release event, or an explicit tag input"
          exit 1
        fi
        # A final release carries a plain version. Refusing an -rcN here is not
        # a per-project setting: it is what "final release" means, so no caller
        # gets to opt out of it. A prerelease is left alone — that is where the
        # -rcN tags belong — and a manual call passing `tag` is deliberate.
        if [ "$EVENT" = "release" ] && [ "$PRERELEASE" != "true" ] \
           && ! echo "$TAG" | grep -Eq '^v?[0-9]+[.][0-9]+[.][0-9]+$'; then
          echo "::error::a final release must be tagged x.y.z, without an -rcN suffix, got '$TAG'"
          exit 1
        fi

        image="${REGISTRY:+$REGISTRY/}$IMAGE"
        tags="$image:$TAG"
        if [ "$LATEST" = "true" ]; then
          tags="$tags,$image:latest"
        fi

        echo "image=$image:$TAG" >> "$GITHUB_OUTPUT"
        echo "tags=$tags" >> "$GITHUB_OUTPUT"
        echo "Publishing \`$tags\`" >> "$GITHUB_STEP_SUMMARY"

    - name: Set up QEMU
      if: ${{ inputs.platforms != '' }}
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # One step for both registries: an empty `registry` means Docker Hub.
    - name: Log in to the registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry == 'ghcr.io' && github.repository_owner || inputs.dockerhub-username }}
        password: ${{ inputs.registry == 'ghcr.io' && inputs.github-token || inputs.dockerhub-token }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ steps.tags.outputs.tags }}
