name: Quality
description: The checks shared by every RMéS project, front-end or back-end, whatever its stack

# The checks that do not depend on the stack of the project, shared by all of them
# — see README.md. It is not meant to be called on its own: `quality-front` and
# `quality-back` start with it, then run the checks of their own stack. A check
# added here reaches every project on its next run.
#
# Today: the title of the pull request follows Conventional Commits, and the
# Dockerfile passes hadolint. Each used to be a separate workflow in each
# repository (`pr-name.yml`, `hadolint.yml`).
#
# The title check is skipped outside a pull request, so that the same job can also
# serve as the quality gate of a release or a scheduled run. Hadolint runs on every
# event: a Dockerfile is as wrong on main as in a pull request.

inputs:
  pr-title-check:
    description: "Check that the pull request title follows Conventional Commits. 'false' to skip"
    required: false
    default: 'true'
  pr-title-require-scope:
    description: "Require a scope in the pull request title, as in feat(concepts): …"
    required: false
    default: 'false'
  github-token:
    description: "Token reading the pull request"
    required: false
    default: ${{ github.token }}
  hadolint-dockerfile:
    description: "Dockerfile to lint with hadolint, relative to the repository root. Empty = skipped"
    required: false
    default: ""
  hadolint-failure-threshold:
    description: "Lowest hadolint severity that fails the step: error, warning, info, style"
    required: false
    default: warning

runs:
  using: composite
  steps:
    - name: 🧪 Checking the pull request title
      if: >-
        ${{ inputs.pr-title-check == 'true'
          && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
      uses: amannn/action-semantic-pull-request@v6
      with:
        requireScope: ${{ inputs.pr-title-require-scope }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    # Hadolint reads the `.hadolint.yaml` of the repository root (exceptions,
    # trusted registries), but not its threshold: the action always passes its own
    # flag, hence the input.
    - name: 🐳 Linting the Dockerfile
      if: ${{ inputs.hadolint-dockerfile != '' }}
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ${{ inputs.hadolint-dockerfile }}
        failure-threshold: ${{ inputs.hadolint-failure-threshold }}
